[hidden]{display:none!important}

const undoS=[], redoS=[]; const MAXH=15;
function snapshot(){ return PX.getImageData(0,0,W,W); }
function pushHistory(){ undoS.push(snapshot()); if(undoS.length>MAXH) undoS.shift(); redoS.length=0; syncTools(); }
function undo(){ if(!undoS.length) return; redoS.push(snapshot()); PX.putImageData(undoS.pop(),0,0); syncTools(); saveDraft(); }
function redo(){ if(!redoS.length) return; undoS.push(snapshot()); PX.putImageData(redoS.pop(),0,0); syncTools(); saveDraft(); }
function blank(){ PX.save(); PX.globalCompositeOperation='source-over'; PX.fillStyle='#ffffff'; PX.fillRect(0,0,W,W); PX.restore(); }
function setTemplate(id){ state.tpl=id; LX.clearRect(0,0,W,W); drawTemplate(LX,id,1); syncTpl(); }

function pos(e){ const r=cO.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*W/r.height]; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }

// 페인트통: 칠한 그림과 도안 선을 합쳐서 경계를 찾고, 칠은 아래 층에만 함
function floodFill(x0,y0,hex){
  x0=Math.max(0,Math.min(W-1,x0|0)); y0=Math.max(0,Math.min(W-1,y0|0));
  const tmp=document.createElement('canvas'); tmp.width=tmp.height=W; const tg=tmp.getContext('2d',{willReadFrequently:true});
  tg.drawImage(cP,0,0); tg.drawImage(cL,0,0); const d=tg.getImageData(0,0,W,W).data;
  const img=PX.getImageData(0,0,W,W), p=img.data;
  const i0=(y0*W+x0)*4, tr=d[i0], tgc=d[i0+1], tb=d[i0+2];
  const [fr,fg,fb]=hexRgb(hex);
  if(Math.abs(tr-fr)+Math.abs(tgc-fg)+Math.abs(tb-fb)<8) return false;
  const tol=60, mask=new Uint8Array(W*W);
  const ok=i=>{ const k=i*4; return !mask[i] && Math.abs(d[k]-tr)+Math.abs(d[k+1]-tgc)+Math.abs(d[k+2]-tb)<=tol; };
  const stack=[x0,y0];
  while(stack.length){ const y=stack.pop(), x0s=stack.pop(); let x=x0s; let i=y*W+x;
    while(x>=0 && ok(i)){ x--; i--; } x++; i++;
    let up=false, dn=false;
    while(x<W && ok(i)){ mask[i]=1;
      if(y>0){ const u=i-W; if(ok(u)){ if(!up){ stack.push(x,y-1); up=true; } } else up=false; }
      if(y<W-1){ const v=i+W; if(ok(v)){ if(!dn){ stack.push(x,y+1); dn=true; } } else dn=false; }
      x++; i++; } }
  // 경계의 흐린 테두리까지 1칸 넓혀서 하얀 틈이 안 남게
  const grow=new Uint8Array(mask);
  for(let y=1;y<W-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x; if(mask[i]) continue; if(mask[i-1]||mask[i+1]||mask[i-W]||mask[i+W]) grow[i]=1; }
  for(let i=0;i<W*W;i++) if(grow[i]){ const k=i*4; p[k]=fr; p[k+1]=fg; p[k+2]=fb; p[k+3]=255; }
  PX.putImageData(img,0,0); return true;
}
function shapePath(g,t,a,b){
  g.beginPath();
  if(t==='line'){ g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); }
  else if(t==='rect'){ g.rect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); }
  else { g.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2||1,Math.abs(b[1]-a[1])/2||1,0,0,Math.PI*2); }
  g.stroke();
}
function stroke(g,color,size){ g.strokeStyle=color; g.lineWidth=size; g.lineCap='round'; g.lineJoin='round'; }

let drawing=null;
cO.addEventListener('pointerdown', e=>{
  if(e.button!==undefined && e.button>0) return;
  e.preventDefault(); cO.setPointerCapture(e.pointerId);
  const p=pos(e), t=state.tool;
  if(t==='fill'){ pushHistory(); if(!floodFill(p[0],p[1],state.color)) undoS.pop(); syncTools(); markDirty(); return; }
  if(t==='sticker'){ pushHistory(); const s=state.size*3+28; PX.save(); PX.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; PX.textAlign='center'; PX.textBaseline='middle'; PX.fillText(state.sticker,p[0],p[1]); PX.restore(); markDirty(); return; }
  pushHistory();
  drawing={id:e.pointerId, t, start:p, last:p, mid:p};
  if(t==='brush'||t==='eraser'){ stroke(PX, t==='eraser'?'#ffffff':state.color, state.size); PX.beginPath(); PX.moveTo(p[0],p[1]); PX.lineTo(p[0]+0.01,p[1]); PX.stroke(); }
});
cO.addEventListener('pointermove', e=>{
  if(!drawing || e.pointerId!==drawing.id) return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(drawing.t==='brush'||drawing.t==='eraser'){
    stroke(PX, drawing.t==='eraser'?'#ffffff':state.color, state.size);
    for(const ev of evs){ const p=pos(ev); const mid=[(drawing.last[0]+p[0])/2,(drawing.last[1]+p[1])/2];
      PX.beginPath(); PX.moveTo(drawing.mid[0],drawing.mid[1]); PX.quadraticCurveTo(drawing.last[0],drawing.last[1],mid[0],mid[1]); PX.stroke();
      drawing.last=p; drawing.mid=mid; }
  } else { const p=pos(e); drawing.last=p; OX.clearRect(0,0,W,W); stroke(OX,state.color,state.size); shapePath(OX,drawing.t,drawing.start,p); }
});
function endDraw(e){
  if(!drawing || (e && e.pointerId!==drawing.id)) return;
  if(drawing.t==='brush'||drawing.t==='eraser'){ stroke(PX, drawing.t==='eraser'?'#ffffff':state.color, state.size); PX.beginPath(); PX.moveTo(drawing.mid[0],drawing.mid[1]); PX.lineTo(drawing.last[0],drawing.last[1]); PX.stroke(); }
  else { OX.clearRect(0,0,W,W); stroke(PX,state.color,state.size); shapePath(PX,drawing.t,drawing.start,drawing.last); }
  drawing=null; markDirty();
}
cO.addEventListener('pointerup', endDraw); cO.addEventListener('pointercancel', endDraw);

    if(['undo','redo','clear'].includes(id)) b.removeAttribute('aria-pressed'); else b.setAttribute('aria-pressed', String(state.tool===id));

function chooseTemplate(id){

    renderWall(rows, false);
  }catch(e){ $('wall').innerHTML='<p class="empty">전시관을 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.</p>'; $('moreBtn').hidden=true; }
}
function reloadWall(){ gal.offset=0; gal.items=[]; $('wall').innerHTML=''; buildGalleryChips(); loadWall(); }
function renderWall(rows, emptyMine){
  const w=$('wall');
  if(gal.offset===0) w.innerHTML='';
  gal.items=gal.items.concat(rows);
  rows.forEach(a=>{ const b=document.createElement('button'); b.type='button'; b.className='art';
    const im=document.createElement('img'); im.loading='lazy'; im.alt=a.title; im.src=imgUrl(a.image_path);
    const pl=document.createElement('span'); pl.className='plate';
    const t=document.createElement('b'); t.textContent=a.title;
    const m=document.createElement('span'); const who=document.createElement('span'); who.textContent=(ANIMALS[a.animal]||ANIMALS.cat)[1]+' '+a.nickname; const lk=document.createElement('span'); lk.textContent='♥ '+a.likes; m.append(who,lk);
    pl.append(t,m); b.append(im,pl); b.addEventListener('click',()=>{ location.hash='art-'+a.id; }); w.appendChild(b); });
  if(!gal.items.length){ w.innerHTML = `<p class="empty">${emptyMine||gal.mine ? '아직 건 그림이 없어요. 그리기에서 그려서 걸어 보세요.' : '아직 걸린 그림이 없어요. 첫 번째 작가가 되어 보세요!'}</p>`; }
  $('moreBtn').hidden = rows.length<36;
}
$('moreBtn').addEventListener('click',()=>{ gal.offset+=36; loadWall(); });

let cur=null;
async function openArt(id){
  let a=gal.items.find(x=>x.id===id);
  if(!a){ try{ const r=await rpc('ohopl_art_list',{p_ids:[id],p_limit:1}); a=r&&r[0]; }catch(e){} }
  if(!a){ toast('그림을 찾을 수 없어요. 내려갔을 수도 있어요'); location.hash='gallery'; return; }
  cur=a;
  $('artImg').src=imgUrl(a.image_path); $('artImg').alt=a.title; $('artTitle').textContent=a.title;
  const an=ANIMALS[a.animal]||ANIMALS.cat;
  const tplName=a.template ? TEMPLATES.find(t=>t.id===a.template)?.name : null;
  $('artMeta').textContent=`${an[1]} ${an[0]} 작가 ${a.nickname} · ${new Date(a.created_at).toLocaleDateString('ko-KR')}${tplName?' · '+tplName+' 도안':' · 자유 그림'}`;
  $('artLikes').textContent=a.likes; $('artLike').setAttribute('aria-pressed',String(liked.has(a.id)));
  $('artSame').hidden=!a.template; $('artReport').disabled=reportedArt.has(a.id); $('artReport').textContent=reportedArt.has(a.id)?'신고함':'신고';
  $('artDlg').hidden=false; $('artClose').focus({preventScroll:true});
}
function closeArt(){ $('artDlg').hidden=true; cur=null; if(location.hash.startsWith('#art-')) history.replaceState(null,'','#gallery'); }
$('artClose').addEventListener('click', closeArt);
$('artDlg').addEventListener('click', e=>{ if(e.target===$('artDlg')) closeArt(); });
$('artLike').addEventListener('click', async ()=>{
  if(!cur || liked.has(cur.id)) { if(cur) toast('이미 하트를 눌렀어요'); return; }
  liked.add(cur.id); store.set('aag_liked',[...liked]); $('artLike').setAttribute('aria-pressed','true'); $('artLikes').textContent=cur.likes+1;
  try{ const n=await rpc('ohopl_art_like',{p_id:cur.id,p_device:DEVICE}); cur.likes=n; $('artLikes').textContent=n; refreshCard(cur); }catch(e){}
});
function refreshCard(a){ const i=gal.items.indexOf(a); const card=$('wall').children[i]; if(card){ const lk=card.querySelector('.plate span span:last-child'); if(lk) lk.textContent='♥ '+a.likes; } }
$('artReport').addEventListener('click', async ()=>{
  if(!cur || reportedArt.has(cur.id)) return;
  reportedArt.add(cur.id); store.set('aag_reported',[...reportedArt]); $('artReport').disabled=true; $('artReport').textContent='신고함';
  try{ await rpc('ohopl_art_report',{p_id:cur.id,p_device:DEVICE}); }catch(e){}
  toast('신고했어요. 여러 명이 신고하면 자동으로 내려가요');
});
let sameArm=0;
$('artSame').addEventListener('click', ()=>{ if(!cur||!cur.template) return;
  if(state.dirty && Date.now()-sameArm>3000){ sameArm=Date.now(); $('artSame').textContent='한 번 더: 그리던 그림이 지워져요'; setTimeout(()=>{ $('artSame').textContent='이 도안으로 그리기'; },3000); return; }
  sameArm=0; const id=cur.template; closeArt(); location.hash='draw'; state.dirty=false; chooseTemplate(id); $('title').value=''; });
$('artCopy').addEventListener('click', async ()=>{
  const url=location.origin+location.pathname+'#art-'+(cur&&cur.id);
  try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }catch(e){ toast(url); }
});

/* ---------- 화면 전환 ---------- */
function route(){
  const h=location.hash.slice(1);
  const art=h.match(/^art-(\d+)$/);
  const isGal = h==='gallery' || !!art;
  $('viewDraw').hidden=isGal; $('viewGallery').hidden=!isGal;
  $('tabDraw').toggleAttribute('aria-current', !isGal); $('tabGallery').toggleAttribute('aria-current', isGal);
  if(!isGal) { $('tabDraw').setAttribute('aria-current','page'); $('tabGallery').removeAttribute('aria-current'); }
  else { $('tabGallery').setAttribute('aria-current','page'); $('tabDraw').removeAttribute('aria-current'); }
  if(isGal && !gal.loaded){ gal.loaded=true; reloadWall(); }
  if(art) openArt(+art[1]); else if(!$('artDlg').hidden) { $('artDlg').hidden=true; cur=null; }
}
addEventListener('hashchange', route);
addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(!$('artDlg').hidden) closeArt(); else if(!$('pubDlg').hidden) $('pubDlg').hidden=true; return; }
  const tag=e.target&&e.target.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
});

/* ---------- 시작 ---------- */
blank(); buildTools(); buildPalette(); buildTemplates();
if(!loadDraft()){ setTemplate('cat'); state.tool='fill'; }
syncTools(); route();
})();
</script>
</body>
</html>
